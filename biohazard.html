<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PixiJS 8-Bit Biohazard</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
  #wrap { position: relative; line-height: 0; }
  #wrap canvas { display: block; image-rendering: pixelated; }
  /* CRT 掃描線（按 G 切換） */
  #crt {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--h, 2px),
      rgba(0,0,0,.22) var(--h, 2px), rgba(0,0,0,.22) var(--p, 4px));
    box-shadow: inset 0 0 80px rgba(0,0,0,.55);
  }
  #help { color: #8a8a8a; font-size: 12px; line-height: 1.6; padding: 4px 8px; text-align: center; }
  #help b { color: #d82800; font-weight: normal; }
</style>
</head>
<body>
<div id="wrap"><div id="crt"></div></div>
<div id="help">
  <b>Enter / 點擊</b> 開始・重播　Space 暫停　R 從頭播放　M 靜音　G 掃描線
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script>
(async () => {
  // ------------------------------------------------------------------
  // 基本設定：320x180 虛擬解析度，上下各留電影黑邊（下方放對話框）
  // ------------------------------------------------------------------
  const W = 320, H = 180;
  const GY = 146;                 // 地面（腳底）
  const TOP = 12, BOT = 154;      // 上下黑邊
  const MANSION_X = 1500, DOOR_X = 1620, CAM_END = 1460;
  const HOUSE_T = 37.8;           // 從這一秒起切換到洋館內部
  const END_START = 98.5;         // 片尾標題出現
  const END_T = 112;              // 整段動畫長度（秒），結束後自動重播
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;

  // 固定種子亂數：每次材質都長一樣
  let seed = 20260714;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  PIXI.TextureSource.defaultOptions.scaleMode = 'nearest';

  const makeCanvas = (w, h) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  };

  // 用函式逐像素繪製材質
  function drawTex(w, h, fn) {
    const c = makeCanvas(w, h), ctx = c.getContext('2d');
    const px = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); };
    const rect = (x, y, w2, h2, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, w2, h2); };
    fn(px, rect, ctx);
    return PIXI.Texture.from(c);
  }

  // 粗線（Bresenham 取樣後蓋方塊），outline = 外擴一格畫黑邊
  function limb(ctx, a, b, c, d, t, col, outline) {
    const n = Math.max(Math.abs(c - a), Math.abs(d - b), 1);
    const o = Math.floor(t / 2) + (outline ? 1 : 0), s = t + (outline ? 2 : 0);
    ctx.fillStyle = outline ? '#000000' : col;
    for (let i = 0; i <= n; i++) {
      ctx.fillRect(Math.round(a + (c - a) * i / n) - o, Math.round(b + (d - b) * i / n) - o, s, s);
    }
  }
  // 依序畫一組圖元：先全部畫黑色剪影當描邊，再上色
  function drawPrims(ctx, prims) {
    const one = (p, outline) => {
      if (p[0] === 'R') {
        const [, x, y, w, h, col] = p;
        ctx.fillStyle = outline ? '#000000' : col;
        if (outline) ctx.fillRect(x - 1, y - 1, w + 2, h + 2); else ctx.fillRect(x, y, w, h);
      } else {
        const [, a, b, c, d, t, col] = p;
        limb(ctx, a, b, c, d, t, col, outline);
      }
    };
    prims.forEach(p => one(p, true));
    prims.forEach(p => { if (p[0] === 'F') p[1](ctx); else one(p, false); });
  }

  // ------------------------------------------------------------------
  // 3x5 像素字型
  // ------------------------------------------------------------------
  const FONT = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111',
    '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001001001001',
    '8': '111101111101111', '9': '111101111001111',
    A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
    E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
    I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
    M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
    Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111',
    ':': '000010000010000', '-': '000000111000000', '!': '010010010000010', '/': '001001010100100',
    '.': '000000000000010', '?': '111001010000010', ',': '000000000010100', "'": '010010000000000',
  };
  const glyphTex = {};
  for (const [ch, bits] of Object.entries(FONT)) {
    glyphTex[ch] = drawTex(3, 5, px => {
      for (let i = 0; i < 15; i++) if (bits[i] === '1') px(i % 3, Math.floor(i / 3), '#ffffff');
    });
  }

  class PixelText extends PIXI.Container {
    constructor(str = '', color = 0xffffff) {
      super();
      this.color = color;
      this.str = null;
      this.setText(str);
    }
    setText(str, color = this.color) {
      if (str === this.str && color === this.color) return;
      this.str = str;
      this.color = color;
      this.removeChildren().forEach(c => c.destroy());
      for (const [ox, oy, tint] of [[1, 1, 0x000000], [0, 0, this.color]]) {
        [...str.toUpperCase()].forEach((ch, i) => {
          const t = glyphTex[ch];
          if (!t) return;
          const s = new PIXI.Sprite(t);
          s.position.set(i * 4 + ox, oy);
          s.tint = tint;
          this.addChild(s);
        });
      }
    }
    // 依縮放置中到畫面
    center(y) {
      this.position.set(Math.round((W - (this.str.length * 4 - 1) * this.scale.x) / 2), y);
      return this;
    }
  }

  // ------------------------------------------------------------------
  // S.T.A.R.S. 隊員像素圖（32x34，面向右，錨點 x=14、腳底第 33 行）
  //   以簡易骨架生成：大腿/小腿/上臂/前臂的絕對角度，0° = 朝下、正值 = 朝前
  //   每種顏色都有 [基本, 陰影, 亮部] 三階
  // ------------------------------------------------------------------
  const SW = 32, SH = 34, AX = 14;
  const SKIN = ['#fcbc8c', '#d88c5c', '#fcd8b0'];
  const BOOT = ['#3c302a', '#1c1614', '#5c4c40'];
  const MEMBERS = {
    wesker: { shirt: ['#2c2c38', '#18181f', '#4c4c5c'], vest: ['#4c4c58', '#30303a', '#70707e'], pants: ['#24242c', '#141418', '#3c3c48'],
              hair: ['#f0d070', '#b89840', '#fcf0b0'], fore: 'sleeve', glove: '#101014', pad: 1, w: 7, gun: 5 },
    chris:  { shirt: ['#4c8c40', '#2c5c2c', '#7cb860'], vest: ['#2c4430', '#1c2c20', '#48644c'], pants: ['#2c3c64', '#1c2444', '#445888'],
              hair: ['#5c3418', '#341c0c', '#7c4c28'], fore: 'sleeve', glove: '#1c1c1c', pad: 1, w: 7, gun: 5 },
    jill:   { shirt: ['#3c6cd0', '#24449c', '#6c9cf0'], vest: ['#2c4ca8', '#1c2c70', '#4c74d0'], pants: ['#2c3858', '#1c2440', '#445478'],
              hair: ['#5c3418', '#3c200c', '#7c4c2c'], beret: ['#2858d8', '#183898', '#5888f8'], fore: 'skin', pad: 1, w: 7, gun: 5 },
    barry:  { shirt: ['#b83424', '#7c1c14', '#e86048'], vest: ['#3c3028', '#241c18', '#5c4c40'], pants: ['#3c3c48', '#24242c', '#58586a'],
              hair: ['#8c4c1c', '#5c300c', '#b47038'], fore: 'skin', w: 8, gun: 7 },
    joseph: { shirt: ['#7c8c54', '#4c5834', '#a4b47c'], vest: ['#44503a', '#2c3424', '#64745a'], pants: ['#40443a', '#282c24', '#5c6050'],
              hair: ['#3c2414', '#24140a', '#5c3c24'], fore: 'sleeve', w: 7, gun: 5 },
    kenneth: { shirt: ['#8c845c', '#5c5838', '#aca47c'], vest: ['#4c4c34', '#30301f', '#6c6c4c'], pants: ['#4c4430', '#30281c', '#6c6048'],
              hair: ['#2c1c10', '#1c1008', '#4c3420'], fore: 'sleeve', w: 7, gun: 5 },
    // 殭屍：灰綠皮膚、破爛染血的襯衫、沒有背心
    zombie: { shirt: ['#a8a090', '#7c7464', '#c8c0b0'], pants: ['#4c4034', '#30281e', '#685a4a'],
              hair: ['#3c3424', '#24200f', '#5c5038'], skin: ['#a8b48c', '#7c8c64', '#c8d4a8'],
              fore: 'skin', w: 7, gun: 5, noVest: 1 },
  };

  // 頭部像素圖（9x12，面向右，第 10~11 列為脖子）：臉部底圖 + 各人髮型
  const FACE = [
    '.........', '.........', '.........',
    '..sssss..', '.sssssLs.', '.ssssssL.', '.Sssssess', '.SsSsssss',
    '.SSssssm.', '..SSsss..', '...SSs...', '...SSs...',
  ];
  const HAIR = {
    chris:  ['.........', '.........', '..h.hh...', '.hhhhhhh.', 'hhhhhhHh.', 'hhh...d..', 'hh.......', '.h.......'],
    jill:   ['..xbbB...', '.xbbbbyB.', 'xbbbbbbbb', 'hhhhhhH..', 'hhh...d..', 'hh.......', 'hh.......', 'hh.......', '.h.......'],
    barry:  ['.........', '.........', '...hhh...', '.hhhhhhh.', 'hhhhhhhH.', 'hhh...d..', 'hh.......',
             '...h.hhh.', '...hhhhm.', '...hhhhh.', '....hhh..'],
    wesker: ['.........', '.........', '...hHH...', '.hhhhHHH.', 'hhhhhhHH.', 'hhh......', 'hh..ggGg.', '.h.......'],
    joseph: ['.........', '.........', '..hhhh...', '.hhhhhhh.', 'wwwwwwww.', 'whh...d..', 'hhh......', 'hh.......', '.h.......'],
    kenneth: ['.........', '.........', '..hhhh...', '.hhhhhhh.', 'hhhhhhhh.', 'hhh...d..', 'hh.......', '.h.......'],
    zombie: ['.........', '.........', '..h..h...', '.hh.hh.h.', 'hh.......', 'h....DD..', 'h....DWs.', '.........',
             '......rm.', '.....rr..', '.....r...'],
  };
  function headMap(name, pal) {
    const hair = HAIR[name], skin = pal.skin || SKIN;
    const col = {
      s: skin[0], S: skin[1], L: skin[2], e: '#1c1010', m: '#a85838',
      D: darken(skin[1], 0.7), W: '#d8d8b4', r: '#a01010',
      h: pal.hair[0], d: pal.hair[1], H: pal.hair[2],
      b: pal.beret && pal.beret[0], x: pal.beret && pal.beret[1], B: pal.beret && pal.beret[2],
      y: '#f8d020', g: '#08080c', G: '#6c7c9c', w: '#e0e0d8',
    };
    return FACE.map((row, y) => [...row].map((ch, x) => {
      const o = hair[y] && hair[y][x];
      const c = o && o !== '.' ? o : ch;
      return c === '.' ? null : col[c];
    }));
  }

  const P_ = o => Object.assign({ lean: 0, bt: 4, bs: 4, ft: -4, fs: -4, bu: -6, bf: 4, fu: 8, ff: 18 }, o);
  const POSES = {
    stand: P_({}),
    aim:   P_({ bt: -14, bs: -8, ft: 16, fs: 8, bu: 70, bf: 100, fu: 92, ff: 90, gun: 1 }),
    hurt:  P_({ lean: -14, bt: -8, bs: -4, ft: 24, fs: 10, bu: 160, bf: 190, fu: 145, ff: 175 }),
    reach: P_({ bt: 30, bs: -20, ft: 4, fs: 2, bu: -4, bf: 6, fu: 80, ff: 55 }),
    // 殭屍：跪著啃食、中彈後仰
    zcrouch: P_({ lean: 55, ft: 85, fs: 0, bt: 0, bs: -90, fu: 25, ff: 5, bu: 15, bf: -5 }),
    zhit:    P_({ lean: -12, bt: -10, bs: -6, ft: 20, fs: 8, bu: 55, bf: 70, fu: 60, ff: 72 }),
  };
  // 6 格跑步 / 走路循環：膝蓋只在腳往前擺時大幅彎曲
  const legSwing = (q, amp, k0, k1) => {
    const th = amp * Math.sin(q);
    return [th, th - (Math.cos(q) > 0 ? k0 + k1 * Math.cos(q) : k0)];
  };
  for (let i = 0; i < 6; i++) {
    const p = i / 6 * Math.PI * 2, s = Math.sin(p);
    const [rft, rfs] = legSwing(p, 42, 12, 70), [rbt, rbs] = legSwing(p + Math.PI, 42, 12, 70);
    POSES['run' + i] = P_({ lean: 12, ft: rft, fs: rfs, bt: rbt, bs: rbs, fu: -45 * s + 15, ff: -45 * s + 105, bu: 45 * s + 15, bf: 45 * s + 105 });
    const [wft, wfs] = legSwing(p, 24, 4, 30), [wbt, wbs] = legSwing(p + Math.PI, 24, 4, 30);
    POSES['walk' + i] = P_({ lean: 3, ft: wft, fs: wfs, bt: wbt, bs: wbs, fu: -22 * s, ff: -22 * s + 18, bu: 22 * s, bf: 22 * s + 18 });
    // 殭屍拖步：雙手前伸、步伐小
    const [zft, zfs] = legSwing(p, 16, 6, 24), [zbt, zbs] = legSwing(p + Math.PI, 16, 6, 24);
    POSES['zwalk' + i] = P_({ lean: 10, ft: zft, fs: zfs, bt: zbt, bs: zbs, fu: 68 + 6 * s, ff: 82, bu: 62 - 6 * s, bf: 78 });
  }

  const seg = (p, len, deg) => { const r = deg * Math.PI / 180; return [p[0] + Math.sin(r) * len, p[1] + Math.cos(r) * len]; };
  // 計算關節位置，並把較低的那隻腳貼齊地面
  function skeleton(P) {
    const legs = hip => {
      const bk = seg(hip, 6, P.bt), fk = seg(hip, 6, P.ft);
      return { hip, bk, ba: seg(bk, 6, P.bs), fk, fa: seg(fk, 6, P.fs) };
    };
    let S = legs([AX, 20]);
    S = legs([AX, 20 + 32 - Math.max(S.ba[1], S.fa[1])]);
    S.neck = seg(S.hip, 9, 180 - P.lean);
    S.bsh = [S.neck[0] - 1, S.neck[1] + 2]; S.fsh = [S.neck[0] + 1, S.neck[1] + 2];
    S.be = seg(S.bsh, 5, P.bu); S.bw = seg(S.be, 5, P.bf);
    S.fe = seg(S.fsh, 5, P.fu); S.fw = seg(S.fe, 5, P.ff);
    return S;
  }

  const darken = (hex, f) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) * f).toString(16).padStart(2, '0')).join('');
  const backCols = c => [c[1], darken(c[1], 0.7), c[0]];
  function stroke(ctx, a, b, w, col, dx = 0) {
    const n = Math.max(Math.ceil(Math.abs(b[0] - a[0])), Math.ceil(Math.abs(b[1] - a[1])), 1);
    const o = Math.floor(w / 2);
    ctx.fillStyle = col;
    for (let i = 0; i <= n; i++) {
      ctx.fillRect(Math.round(a[0] + (b[0] - a[0]) * i / n) - o + dx, Math.round(a[1] + (b[1] - a[1]) * i / n) - o, w, w);
    }
  }
  // 有明暗的肢體：左緣陰影、右緣（月光側）亮部
  function limbOp(a, b, w, cols) {
    return (ctx, pass) => {
      if (pass === 0) return stroke(ctx, a, b, w + 2, '#000000');
      if (w >= 3) { stroke(ctx, a, b, w, cols[1]); stroke(ctx, a, b, w - 1, cols[0], 1); stroke(ctx, a, b, 1, cols[2], 1); }
      else { stroke(ctx, a, b, w, cols[0]); stroke(ctx, a, b, 1, cols[2]); }
    };
  }
  function rectOp(x, y, w, h, col, light) {
    x = Math.round(x); y = Math.round(y);
    return (ctx, pass) => {
      ctx.fillStyle = pass === 0 ? '#000000' : col;
      if (pass === 0) ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      else { ctx.fillRect(x, y, w, h); if (light) { ctx.fillStyle = light; ctx.fillRect(x, y, w, 1); } }
    };
  }
  function bootOp(ankle, knee, cols) {
    const up = seg(ankle, 2, Math.atan2(knee[0] - ankle[0], knee[1] - ankle[1]) * 180 / Math.PI);
    const leg = limbOp(ankle, up, 3, cols);
    const foot = rectOp(ankle[0] - 1, ankle[1], 4, 2, cols[0], cols[2]);
    return (ctx, pass) => { leg(ctx, pass); foot(ctx, pass); };
  }
  function torsoOp(S, pal) {
    return (ctx, pass) => {
      const w = pal.w, top = Math.round(S.neck[1]), n = Math.round(S.hip[1]) + 1 - top;
      for (let r = 0; r <= n; r++) {
        const y = top + r, cx = Math.round(lerp(S.neck[0], S.hip[0], r / n)), x0 = cx - Math.floor(w / 2);
        if (pass === 0) { ctx.fillStyle = '#000000'; ctx.fillRect(x0 - 1, y - 1, w + 2, 3); continue; }
        for (let c = 0; c < w; c++) {
          const vest = !pal.noVest && r >= 1 && r <= n - 4 && c >= 1;
          const cols = vest ? pal.vest : pal.shirt;
          let col = c === 0 ? cols[1] : c === w - 1 ? cols[2] : cols[0];
          if (!pal.noVest) {
            if (r === 2 && c === 2) col = '#f8c800';                       // S.T.A.R.S. 徽章
            if (r === 2 && c === 3) col = '#c82010';
            if (r === n - 5 && c >= w - 3 && c < w - 1) col = pal.vest[2]; // 彈匣袋
            if (r === n - 4 && c >= w - 3 && c < w - 1) col = pal.vest[1];
          } else if (r < n - 2 && (c * 7 + r * 13) % 6 === 0) col = r < 4 ? '#8c1010' : '#5c3c30'; // 血跡與破洞
          if (r === n - 2) col = c === w - 2 ? '#c8c0a0' : '#1c1814';      // 腰帶
          if (r >= n - 1) col = c === 0 ? pal.pants[1] : pal.pants[0];
          ctx.fillStyle = col; ctx.fillRect(x0 + c, y, 1, 1);
        }
      }
    };
  }
  function headOp(map, S) {
    const hx = Math.round(S.neck[0]) - 4, hy = Math.round(S.neck[1]) - 11;
    return (ctx, pass) => map.forEach((row, y) => row.forEach((col, x) => {
      if (!col) return;
      ctx.fillStyle = pass === 0 ? '#000000' : col;
      if (pass === 0) ctx.fillRect(hx + x - 1, hy + y - 1, 3, 3); else ctx.fillRect(hx + x, hy + y, 1, 1);
    }));
  }

  const GUN_TIP = {};
  function soldierCanvas(name, P) {
    const pal = MEMBERS[name], S = skeleton(P);
    const c = makeCanvas(SW, SH), ctx = c.getContext('2d');
    const skin = pal.skin || SKIN;
    const handCol = pal.glove ? [pal.glove, pal.glove, '#3c3c44'] : skin;
    const foreCols = pal.fore === 'skin' ? skin : pal.shirt;
    const hand = (w, cols) => rectOp(w[0] - 1, w[1] - 1, 2, 2, cols[0], cols[2]);
    const ops = [
      limbOp(S.bsh, S.be, 2, backCols(pal.shirt)), limbOp(S.be, S.bw, 2, backCols(foreCols)), hand(S.bw, backCols(handCol)),
      limbOp(S.hip, S.bk, 3, backCols(pal.pants)), limbOp(S.bk, S.ba, 3, backCols(pal.pants)), bootOp(S.ba, S.bk, backCols(BOOT)),
      torsoOp(S, pal),
      limbOp([S.hip[0] + 1, S.hip[1]], S.fk, 3, pal.pants), limbOp(S.fk, S.fa, 3, pal.pants), bootOp(S.fa, S.fk, BOOT),
    ];
    if (!P.gun) ops.push(rectOp(lerp(S.hip[0] + 1, S.fk[0], 0.45) - 1, lerp(S.hip[1], S.fk[1], 0.45) - 1, 3, 3, '#1c1814', '#3c3430')); // 槍套
    ops.push(headOp(headMap(name, pal), S));
    if (P.gun) {
      const gx = Math.round(S.fw[0]), gy = Math.round(S.fw[1]) - 2;
      ops.push(rectOp(gx, gy, pal.gun, 2, '#4c4c54', '#9c9ca8'), rectOp(gx, gy + 2, 2, 2, '#2c2c30'));
      GUN_TIP[name] = { dx: gx + pal.gun - AX, dy: gy - SH };
    }
    ops.push(limbOp(S.fsh, S.fe, 2, pal.shirt), limbOp(S.fe, S.fw, 2, foreCols));
    if (pal.pad) ops.push(rectOp(S.fsh[0] - 1, S.fsh[1] - 1, 3, 2, pal.vest[0], pal.vest[2]));   // 護肩
    ops.push(hand(S.fw, handCol));
    ops.forEach(op => op(ctx, 0));
    ops.forEach(op => op(ctx, 1));
    return c;
  }
  const soldierTex = (name, P) => PIXI.Texture.from(soldierCanvas(name, P));

  // 殭屍回頭特寫：以球面座標算出臉部特徵，yaw = π 背對、0 正面
  function zombieHeadTex(yaw) {
    return drawTex(40, 40, (px, rect) => {
      const filled = new Set();
      const put = (x, y, c) => { px(x, y, c); filled.add(y * 40 + x); };
      const hash = (a, b) => { const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return v - Math.floor(v); };
      for (let y = 33; y < 40; y++) for (let x = Math.max(0, 6 - (y - 33) * 2); x < Math.min(40, 34 + (y - 33) * 2); x++) {
        put(x, y, hash(x, y) < 0.12 ? '#8c1010' : x < 16 ? '#c8c0b0' : x < 28 ? '#a8a090' : '#7c7464');
      }
      for (let y = 27; y < 34; y++) for (let x = 15; x < 26; x++) put(x, y, x < 18 ? '#7c8c64' : x < 23 ? '#5c6848' : '#46523a');
      const cx = 20, cy = 16, rx = 11, ry = 13;
      const SK = ['#d0dcb0', '#a8b48c', '#7c8c64', '#56623e'];
      for (let y = 0; y < 34; y++) for (let x = 0; x < 40; x++) {
        const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry, r2 = nx * nx + ny * ny;
        if (r2 > 1) continue;
        const nz = Math.sqrt(1 - r2);
        let L = Math.atan2(nx, nz) + yaw;
        L = Math.atan2(Math.sin(L), Math.cos(L));
        const lat = Math.asin(clamp(ny, -1, 1));
        const light = -0.55 * nx - 0.35 * ny + 0.75 * nz;
        let col = SK[light > 0.6 ? 0 : light > 0.25 ? 1 : light > -0.05 ? 2 : 3];
        if ((lat < -0.5 || (Math.abs(L) > 1.9 && lat < 0.5)) && hash(x, y) > 0.22) col = light > 0.4 ? '#5c5038' : '#3c3424';
        if (Math.abs(Math.abs(L) - 1.6) < 0.2 && Math.abs(lat - 0.05) < 0.22) col = Math.abs(Math.abs(L) - 1.6) < 0.08 ? '#46523a' : SK[2];
        if (Math.hypot(L - 0.9, lat + 0.25) < 0.18) col = '#6c1c14';                 // 腐爛傷口
        for (const sgn of [-1, 1]) {
          const dl = L - sgn * 0.4, dt = lat + 0.02;
          if (dl * dl / 0.06 + dt * dt / 0.025 < 1) col = '#2c3424';                   // 凹陷眼窩
          if (dl * dl / 0.018 + dt * dt / 0.008 < 1) col = '#dcdcb8';                  // 混濁白眼
        }
        if (Math.abs(L) < 0.1 && lat > 0.08 && lat < 0.28) col = lat > 0.24 ? '#2c3424' : SK[2];
        if (Math.abs(L) < 0.3 && lat > 0.36 && lat < 0.41) col = hash(x, 1) > 0.35 ? '#c8c09c' : '#1c0606';
        if (Math.abs(L) < 0.3 && lat >= 0.41 && lat < 0.52) col = '#1c0606';
        if (Math.abs(L) < 0.36 && lat >= 0.5 && hash(x, 7) > 0.3) col = hash(x, y) > 0.5 ? '#9c1010' : '#6c0808';
        if (Math.abs(L) < 0.34 && lat > 0.33 && lat <= 0.36) col = '#6c1010';
        put(x, y, col);
      }
      for (let y = 0; y < 40; y++) for (let x = 0; x < 40; x++) {
        if (filled.has(y * 40 + x)) continue;
        if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => filled.has((y + dy) * 40 + x + dx) && x + dx >= 0 && x + dx < 40)) px(x, y, '#000000');
      }
    });
  }

    init() {
      if (!this.ctx) {

        if (AC) {
          this.ctx = new AC();
          const len = this.ctx.sampleRate;
          this.noiseBuf = this.ctx.createBuffer(1, len, len);
          const d = this.noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }

      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    get on() { return this.ctx && !this.muted; },
    tone(type, f0, f1, dur, vol = 0.05, delay = 0) {
      if (!this.on) return;

      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    },
    noise(dur, vol, freq, delay = 0) {

      const t = this.ctx.currentTime + delay;
      const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      src.buffer = this.noiseBuf; src.loop = true;
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.ctx.destination);
      src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
    },

    const k = a.keys;

    while (i < k.length - 1 && t >= k[i + 1].t) i++;
    const A = k[i], B = k[i + 1];
    let x = A.x, v = 0, u = 0;
    if (B && t >= A.t) {

      x = lerp(A.x, B.x, u);
      v = (B.x - A.x) / (B.t - A.t);
    }
    const o = A.o;
    if (o.face) a.face = o.face; else if (Math.abs(v) > 1) a.face = Math.sign(v);
    a.dist += Math.abs(x - a.x);
    a.x = x;
    a.y = o.jump ? -o.jump * Math.sin(Math.PI * u) : 0;
    let pose = o.pose || (Math.abs(v) > 45 ? 'run' : Math.abs(v) > 2 ? 'walk' : 'stand');
    const s = a.sprite;

    if (a.isDog) {

      if (a.member === 'zombie' && (pose === 'walk' || pose === 'run')) pose = 'zwalk' + (Math.floor(a.dist / 3) % 6);

      if (pose === 'zcrouch') jitter = Math.floor(t * 3) % 2;       // 低頭啃食
      s.texture = soldierTexs[a.member][pose];
    }
    a.pose = pose;
    s.position.set(Math.round(a.x) + jitter, GY + Math.round(a.y));
    s.scale.x = a.face;
    s.visible = !o.hide;
    s.alpha = o.enter ? clamp(1 - (t - A.t) / 0.2, 0, 1) : 1;

  // ------------------------------------------------------------------
  // 遊戲狀態
  // ------------------------------------------------------------------
  const G = { state: 'title', t: 0, paused: false, cam: 0, ev: 0, flash: 0, red: 0, shake: 0, typed: -1, dlg: -1 };

  function restart() {
    G.state = 'play'; G.t = 0; G.cam = 0; G.ev = 0; G.flash = 0; G.red = 0; G.shake = 0; G.typed = -1; G.dlg = -1;
    G.paused = false;
    for (const a of Object.values(actors)) { a.dist = 0; a.x = a.keys[0].x; a.face = 1; }
    parts.splice(0).forEach(p => p.s.destroy());
    flashes.splice(0).forEach(f => f.s.destroy());
    dripLayer.removeChildren().forEach(c => c.destroy());
  }

  function camAt(t) {
    const keys = [[0, 0], [4, 0], [9, 60], [17, 60]];
    if (t >= 17) return null;
    let i = 0;
    while (i < keys.length - 1 && t >= keys[i + 1][0]) i++;
    const [t0, x0] = keys[i], [t1, x1] = keys[i + 1] || keys[i];
    const u = t1 > t0 ? clamp((t - t0) / (t1 - t0), 0, 1) : 0;
    return lerp(x0, x1, u * u * (3 - 2 * u));
  }

  function nightTint(f) {
    const c = [0xb8, 0xc0, 0xec].map(v => Math.round(lerp(v, 255, clamp(f, 0, 1))));
    return (c[0] << 16) | (c[1] << 8) | c[2];
  }

  function step(dt) {
    const t = G.t;
    // 一次性事件
    while (G.ev < EVENTS.length && t >= EVENTS[G.ev][0]) EVENTS[G.ev++][1]();

    for (const a of Object.values(actors)) updateActor(a, t);

    const inHouse = t >= HOUSE_T;
    forest.visible = !inHouse;
    house.visible = inHouse;
    vignette.alpha = inHouse ? 0.35 : 1;
    if (inHouse) houseStep(t, dt); else forestStep(t, dt);

    flashRect.alpha = G.flash * 0.28;
    redRect.alpha = G.red * 0.45;
    G.flash = Math.max(0, G.flash - dt * 7);
    G.red = Math.max(0, G.red - dt * 2);
    root.position.set(Math.round((Math.random() - 0.5) * G.shake), Math.round((Math.random() - 0.5) * G.shake));
    G.shake = Math.max(0, G.shake - dt * 10);

    // 對話（打字機效果）
    const di = DIALOG.findIndex(d => t >= d[0] && t < d[1]);
    if (di !== G.dlg) { G.dlg = di; G.typed = -1; }
    if (di >= 0) {
      const [t0, , who, text] = DIALOG[di];
      const n = Math.min(text.length, Math.floor((t - t0) * 32));
      if (n !== G.typed) {
        if (n % 2 === 0 && n < text.length) sfx.blip();
        G.typed = n;
        dlgName.setText(who, NAME_COL[who]);
        dlgText.setText(text.slice(0, n), 0xfcfcfc);
      }
    } else { dlgName.setText(''); dlgText.setText(''); }
    const mins = 41 + Math.floor(t / 20);
    clock.setText('23:' + mins + (Math.floor(t * 2) % 2 ? ' ' : ':') + String(Math.floor(t * 3) % 60).padStart(2, '0'));
    topLabel.setText(!inHouse ? 'ARKLAY MTS.  JULY 24, 1998'
      : t < 54.4 ? 'MANSION - MAIN HALL' : t < 68.6 ? 'MANSION - DINING ROOM' : 'MANSION - WEST CORRIDOR');

    // 開場字卡、轉場黑場、房間名稱、片尾
    fade.alpha = keyed(FADE, t);
    card.forEach((c, i) => { c.visible = t > 0.4 + i * 0.8 && t < 4.5; c.alpha = clamp((4.3 - t) / 1.2, 0, 1); });
    const rc = ROOM_CARD.find(r => t >= r[0] && t < r[1]);
    roomCard.setText(rc ? rc[2] : '');
    roomCard.center(80);
    roomCard.alpha = fade.alpha;
    showCloseup(t);
    showEnding(t);
  }

  function forestStep(t, dt) {
    // 鏡頭：前段依關鍵格，逃跑段跟著殿後的 Chris
    const ck = camAt(t);
    if (ck !== null) G.cam = ck;
    else {
      const target = Math.min(CAM_END, actors.chris.x - 110);
      G.cam = Math.max(G.cam, G.cam + (target - G.cam) * Math.min(1, dt * 3));
    }
    const cam = Math.round(G.cam);
    worldBack.x = worldFront.x = eyesFront.x = -cam;
    far.tilePosition.x = -Math.round(cam * 0.15);
    mid.tilePosition.x = -Math.round(cam * 0.45);
    ground.tilePosition.x = -cam;
    bushes.tilePosition.x = -Math.round(cam * 1.25);
    bushes.alpha = clamp((1350 - cam) / 150, 0, 1);
    clouds.tilePosition.x = -Math.round(t * 3 + cam * 0.05);
    fogA.tilePosition.x = -Math.round(cam * 1.1 + t * 6);
    fogB.tilePosition.x = -Math.round(cam * 1.2 - t * 4);

    // 草叢裡的紅眼
    eyes.visible = t > 9.4 && t < 12.95 && (t * 1.3) % 2 < 1.8;

    // Brad 的直升機飛走
    const hu = (t - 16.3) / 5.5;
    heli.visible = hu > 0 && hu < 1;
    heliLight.clear();
    if (heli.visible) {
      heli.position.set(Math.round(lerp(-40, 360, hu)), Math.round(lerp(52, 22, hu) + Math.sin(t * 3) * 2));
      heli.texture = heliTex[Math.floor(t * 20) % 2];
      if (Math.floor(t * 2) % 2) heliLight.rect(heli.x - 21, heli.y + 2, 1, 1).fill('#f80000');
      if (Math.floor(t * 12) !== Math.floor((t - dt) * 12)) sfx.noise(0.06, 0.08 * Math.sin(Math.PI * hu), 260);
    }

    // 洋館大門
    let open = 0;
    if (t >= 30.0 && t < 33.05) open = clamp((t - 30.0) / 0.4, 0, 1);
    else if (t >= 33.05) open = clamp(1 - (t - 33.05) / 0.12, 0, 1);
    doorL.scale.x = doorR.scale.x = 1 - 0.85 * open;
    doorGlow.alpha = open;
    lightSpill.clear();
    if (open > 0) {
      lightSpill.poly([DOOR_X - 10, GY, DOOR_X + 10, GY, DOOR_X + 24, GY + 8, DOOR_X - 24, GY + 8]).fill({ color: '#f8b860', alpha: 0.35 * open });
    }

    // 墜機火焰
    if (cam < 140 && Math.random() < 0.6) {
      spawn(62 + rnd() * 10, GY - 12, (rnd() - 0.5) * 6, -15 - rnd() * 15, 0.5 + rnd() * 0.4, rnd() < 0.5 ? 0xf87800 : 0xf8b800);
      if (Math.random() < 0.3) spawn(64 + rnd() * 6, GY - 20, 4 + rnd() * 4, -10, 2.2, 0x3c3c4c);
    }
    // 被咬時濺血
    if (t > 13.5 && t < 16 && Math.random() < 0.08) blood(154, 2);

    // 角色色調：夜色，開槍瞬間被照亮
    const tint = nightTint(G.flash * 0.9);
    for (const a of Object.values(actors)) a.sprite.tint = tint;
  }

  // 洋館內部：鏡頭、燭火、壁爐、鐘擺、走廊吊燈
  function houseStep(t, dt) {
    const cam = Math.round(keyed(HOUSE_CAM, t, true));
    G.cam = cam;
    houseBack.x = houseFront.x = houseDark.x = -cam;
    const room = cam < DINING_X - 200 ? 'hall' : cam < CORRIDOR_X - 100 ? 'dining' : 'corridor';

    // 燭火與光暈（像素同心方塊）
    houseLights.clear();
    for (const [x, y, r] of FLAMES) {
      if (x < cam - 20 || x > cam + W + 20) continue;
      const fl = 0.8 + Math.random() * 0.2;
      for (let k = 3; k >= 1; k--) {
        const rr = Math.round(r * k / 3 * fl);
        houseLights.rect(x - rr, y - rr, rr * 2 + 1, rr * 2 + 1).fill({ color: '#f8b048', alpha: 0.05 });
      }
      houseLights.rect(x, y - (Math.random() < 0.5 ? 3 : 2), 1, 3).fill('#f8d878').rect(x, y, 1, 1).fill('#fcfcf0');
    }
    // 壁爐火光
    if (room === 'dining') {
      const fx = DINING_X + 386, fl = 0.85 + Math.random() * 0.15;
      for (let k = 4; k >= 1; k--) {
        const rr = Math.round(10 * k * fl);
        houseLights.rect(fx - rr * 1.5, 142 - rr, rr * 3, rr + 4).fill({ color: '#f87818', alpha: 0.06 });
      }
      if (Math.random() < 0.9) spawn(fx - 16 + rnd() * 32, 140, (rnd() - 0.5) * 8, -12 - rnd() * 20, 0.4 + rnd() * 0.4, rnd() < 0.5 ? 0xf87800 : 0xf8c800);
      if (Math.random() < 0.08) sfx.crackle();
      // 鐘擺（每秒滴答）
      const ang = Math.sin(t * Math.PI) * 0.35, px0 = DINING_X + 58, py0 = 92;
      const ex = px0 + Math.sin(ang) * 30, ey = py0 + Math.cos(ang) * 30;
      pendulum.clear();
      for (let i = 0; i <= 30; i++) pendulum.rect(Math.round(px0 + Math.sin(ang) * i), Math.round(py0 + Math.cos(ang) * i), 1, 1);
      pendulum.fill('#c8a860');
      pendulum.rect(Math.round(ex) - 2, Math.round(ey) - 2, 5, 5).fill('#e0c070');
      if (Math.floor(t) !== Math.floor(t - dt) && t > 55.4 && t < 68.4) sfx.tick(Math.floor(t) % 2);
    }
    // 走廊：吊燈閃爍、整體昏暗
    houseDark.clear();
    let tint = room === 'hall' ? [0xe8, 0xd8, 0xc0] : room === 'dining' ? [0xf8, 0xd0, 0xa8] : [0xa8, 0xb0, 0xa4];
    if (room === 'corridor') {
      const flick = Math.random() < 0.06 ? 0.25 : Math.sin(t * 37) > 0.97 ? 0.5 : 1;
      const lx = CORRIDOR_X + 240;
      houseDark.rect(CORRIDOR_X, 0, 400, BOT).fill({ color: '#000000', alpha: 0.42 - 0.18 * flick });
      houseDark.poly([lx - 5, 32, lx + 5, 32, lx + 56, 146, lx - 56, 146]).fill({ color: '#e8e0a0', alpha: 0.07 * flick });
      houseDark.rect(lx - 3, 32, 6, 2).fill({ color: '#f8f0c0', alpha: flick });
      tint = tint.map(v => Math.round(v * (0.75 + 0.25 * flick)));
    }
    const c = tint.map(v => Math.round(lerp(v, 255, clamp(G.flash * 0.9, 0, 1))));
    for (const a of Object.values(actors)) a.sprite.tint = (c[0] << 16) | (c[1] << 8) | c[2];
  }

  // 殭屍緩緩回頭的特寫
  function showCloseup(t) {
    const on = t >= 75.5 && t < 79.5;
    closeup.visible = on;
    if (!on) return;
    const f = t < 76.5 ? 0 : t < 77.2 ? 1 : t < 77.8 ? 2 : t < 78.3 ? 3 : 4;
    closeHead.texture = zombieHeads[f];
    const sh = f === 4 && t < 78.7 ? 3 : 0;
    closeHead.position.set(160 + Math.round((Math.random() - 0.5) * sh), 84 + Math.round((Math.random() - 0.5) * sh) + Math.round(Math.sin(t * 2)));
    closeNoise.clear();
    for (let i = 0; i < 40; i++) closeNoise.rect(100 + Math.floor(Math.random() * 120), 22 + Math.floor(Math.random() * 122), 1, 1);
    closeNoise.fill({ color: '#ffffff', alpha: 0.25 });
  }

  function showEnding(t) {
    const on = t >= END_START;
    logo.visible = on && (t > END_START + 0.6 || Math.floor(t * 15) % 2 === 0);
    logo.center(46);
    sub1.setText(t >= END_START + 1.5 ? 'WELCOME TO THE WORLD OF SURVIVAL HORROR' : '');
    sub1.center(86);
    sub2.setText(t >= END_START + 3 ? (Math.floor(t * 2) % 2 === 0 ? 'TO BE CONTINUED...    PRESS ENTER TO REPLAY' : 'TO BE CONTINUED...') : '');
    sub2.center(118);
    // 標題滴血
    if (on && t > END_START + 0.6 && Math.random() < 0.25) {
      const x = logo.x + 4 + Math.floor(rnd() * 140);
      spawn(x, 66, 0, 8 + rnd() * 10, 1.6, 0xa80000, 4, dripLayer, rnd() < 0.3 ? 2 : 1);
    }
  }

  function updateParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += p.grav * dt;
      p.s.x += p.vx * dt;
      p.s.y += p.vy * dt;
      if (p.floor && p.s.y > GY + 1 && p.grav) { p.s.y = GY + 1; p.vy *= -0.3; p.vx *= 0.5; }
      p.life -= dt;
      p.s.alpha = clamp(p.life / p.max * 2, 0, 1);
      if (p.life <= 0) { p.s.destroy(); parts.splice(i, 1); }
    }
    for (let i = flashes.length - 1; i >= 0; i--) {
      flashes[i].life -= dt;
      if (flashes[i].life <= 0) { flashes[i].s.destroy(); flashes.splice(i, 1); }
    }
  }

  // ------------------------------------------------------------------
  // 標題畫面
  // ------------------------------------------------------------------
  function showTitle(t) {
    fade.alpha = 1;
    card.forEach(c => { c.visible = false; });
    roomCard.setText('');
    logo.visible = true; logo.center(46);
    sub1.setText('S.T.A.R.S. ALPHA TEAM - THE MANSION INCIDENT'); sub1.center(86);
    sub2.setText(Math.floor(t * 2) % 2 === 0 ? 'PRESS ENTER OR CLICK' : ''); sub2.center(116);
    dlgName.setText(''); dlgText.setText('');
  }

  let titleT = 0;
  app.ticker.add(tk => {
    const dt = Math.min(tk.deltaMS / 1000, 0.05);
    if (G.state === 'title') { titleT += dt; showTitle(titleT); updateMusic(); return; }
    if (!G.paused) {
      G.t += dt;
      if (G.t >= END_T) restart();
      step(dt);
      updateParts(dt);
    }
    updateMusic();
  });

  // ------------------------------------------------------------------
  // 輸入
  // ------------------------------------------------------------------
  function startOrReplay() {
    sfx.init();
    if (G.state === 'title' || G.t > END_START) restart();
  }
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'enter') startOrReplay();
    else if (k === ' ') { e.preventDefault(); if (G.state === 'play') G.paused = !G.paused; else startOrReplay(); }
    else if (k === 'r') { sfx.init(); restart(); }
    else if (k === 'm') sfx.muted = !sfx.muted;
    else if (k === 'g') crt.style.display = crt.style.display === 'none' ? '' : 'none';
  });
  app.canvas.addEventListener('pointerdown', startOrReplay);

  // 網址加 #t=秒數 可直接跳到該時間點並暫停（例如 biohazard.html#t=24）
  const seek = location.hash.match(/t=([\d.]+)/);
  if (seek) {
    restart();
    const dt = 1 / 60, target = Math.min(+seek[1], END_T - 0.1);
    while (G.t < target) { G.t += dt; step(dt); updateParts(dt); }
    G.paused = true;
  }
})();
</script>
</body>
